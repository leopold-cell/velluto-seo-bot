# Real, time-limited offers — the ONLY place an offer may be defined.
#
# Why this file exists: an evergreen article outlives a time-limited offer. Left
# alone it keeps advertising a deal that ended, which is misleading (§ 5 UWG) and
# exactly the kind of retro-fit this repo is built to avoid. So:
#   - en_keyword_queue.py reads this file and ONLY briefs the model about an offer
#     while it is still running (it vanishes from new articles the day after `ends`);
#   - the model must wrap the offer in a <p> carrying data-offer-id / data-offer-ends;
#   - scripts/offer_expiry.py removes any such element whose end date has passed
#     from already-published articles (daily, run.sh).
# Never describe an offer anywhere else, and never invent one: if it is not in this
# file it does not exist.
offers:
  - id: chromo-2x1
    # EN wording the articles use. Deliberately terse: the operator supplied only
    # "2x1 on the Chromo until end of November". Anything beyond that (free, a
    # percentage, a EUR saving, same-colour or stock conditions) is NOT known and
    # must not be written — readers are sent to the product page for conditions.
    headline: "2-for-1 on the Velluto Chromo"
    product_url: https://velluto-shop.com/products/velluto-chromo
    ends: 2026-11-30          # inclusive; articles are cleaned from 2026-12-01
    source: "operator message, 2026-10-08"
    # Terms supplied by the operator 2026-10-08, and nothing more: the second pair
    # is free, and the two pairs do NOT have to be the same colour. Everything else
    # (how it is applied at checkout, code or automatic, stock, shipping, other
    # products) is unknown and must not be written.
    terms_known: true
    terms: "The second pair is free. The two pairs do not have to be the same colour."
